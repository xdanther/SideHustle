name: Update AltStore source

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/update-source.yml"

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build source.json
        run: node scripts/build-source.mjs --remote

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json data/releases.json data/byetunes.json
          if git diff --cached --quiet; then
            echo "source.json is already up to date"
            exit 0
          fi
          LATEST=$(node -p "require('./source.json').apps.map(a => a.name + ' ' + a.versions[0].version).join(', ')")
          echo "::notice::Latest in the source: $LATEST"
          git commit -m "chore: refresh app releases into source.json ($LATEST)"
          git push
